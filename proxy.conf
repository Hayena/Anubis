# --- Listen configuration ---
listen {
  host = "127.0.0.1"
  port = 4001
}

# --- REST API server configuration ---
api {
  host = "127.0.0.1"
  port = 8080
}

# --- Proxies ---
# Each proxy is a named upstream endpoint. `type` can be `http` or `socks5`.
# `health` defines the interval (seconds) and timeout (seconds) for health checks.
proxies = [
  {
    name = "office"
    type = "http"
    host = "proxy.company.com"
    port = 8080
    health {
      interval = 30
      timeout = 5
    }
  },
  {
    name = "vpn"
    type = "socks5"
    host = "vpn.example.com"
    port = 1080
    health {
      interval = 60
      timeout = 10
    }
  }
]

# --- Routing Rules ---
# Rules are evaluated in order; the first match wins.
# Supported matchers: `domain` (wildcard `*.example.com` or exact `example.com`),
# `host` (exact hostname), `cidr` (e.g. `10.0.0.0/8`), or any combination.
# `route` can be a proxy name, a group name, or `direct`.
rules = [
  {
    domain = "*.company.com"
    route = "office"
  },
  {
    domain = "*.streaming.com"
    route = "vpn"
  },
  {
    host = "github.com"
    route = "direct"
  },
  {
    cidr = "10.0.0.0/8"
    route = "direct"
  },
  {
    route = "direct"
  }
]

# --- Default Route ---
# Used when no rule matches. `route` can be a proxy name, a group name, or `direct`.
default = "direct"
