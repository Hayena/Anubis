# --- Ports (always bound to 127.0.0.1) ---
proxyPort = 4001
apiPort = 8080

# --- Proxies ---
# Each key is the name of an upstream proxy. `type` can be `http` or `socks5`.
# `health` sets the check interval and timeout as HOCON durations (e.g. `30s`, `500ms`).
proxies {
  office {
    type = "http"
    host = "proxy.company.com"
    port = 8080
    health {
      interval = 30s
      timeout = 5s
    }
  }
  vpn {
    type = "socks5"
    host = "vpn.example.com"
    port = 1080
    health {
      interval = 60s
      timeout = 10s
    }
  }
}

# --- Routing Rules ---
# Rules are evaluated in order; the first match wins.
# Supported matchers: `domain` (wildcard `*.example.com` or exact `example.com`),
# `host` (exact hostname), `cidr` (e.g. `10.0.0.0/8`), or any combination.
# `route` can be a proxy name or `direct`.
rules = [
  {
    domain = "*.company.com"
    route = "office"
  },
  {
    domain = "*.streaming.com"
    route = "vpn"
  },
  {
    host = "github.com"
    route = "direct"
  },
  {
    cidr = "10.0.0.0/8"
    route = "direct"
  }
]

# --- Default Route ---
# Used when no rule matches. `route` can be a proxy name or `direct`.
default = "direct"
