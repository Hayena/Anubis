[workspace]
resolver = "2"
members = ["."]

[package]
name = "anubis"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local forward proxy with adaptive routing"
license = "MIT"

# This crate is a binary-only crate. No library target.

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "net", "io-util", "sync", "rt-multi-thread", "signal", "fs"] }
hyper = "1"
tokio-socks = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hocon-parser = { version = "1.14", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
ipnet = { version = "2", features = ["serde"] }
regex = "1"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
notify = "8"
clap = { version = "4", features = ["derive"] }
wiremock = "0.6"
rstest = "0.19"
mockall = "0.13"
async-trait = "0.1"
axum = "0.8"
tower = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[dependencies]
tokio = { workspace = true, features = ["macros", "net", "io-util", "sync", "rt-multi-thread", "signal", "fs"] }
hyper = { workspace = true }
tokio-socks = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hocon-parser = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
ipnet = { workspace = true }
regex = { workspace = true }
bytes = { workspace = true }
tokio-util = { workspace = true }
notify = { workspace = true }
clap = { workspace = true }
wiremock = { workspace = true }
rstest = { workspace = true }
mockall = { workspace = true }
async-trait = "0.1"
axum = "0.8"
tower = "0.5"

[dev-dependencies]
tempfile = "3"
