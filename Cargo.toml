[workspace]
resolver = "2"
members = ["."]

[package]
name = "anubis"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local forward proxy with adaptive routing"
license = "MIT"

# This crate is a binary-only crate. No library target.

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "net", "io-util", "sync", "rt-multi-thread", "signal"] }
tokio-socks = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hocon-parser = { version = "1.14", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
ipnet = { version = "2", features = ["serde"] }
regex = "1"
notify = "8"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
axum = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1

[dependencies]
tokio = { workspace = true, features = ["macros", "net", "io-util", "sync", "rt-multi-thread", "signal"] }
tokio-socks = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
hocon-parser = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
ipnet = { workspace = true }
regex = { workspace = true }
notify = { workspace = true }
clap = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }

[dev-dependencies]
tempfile = "3"
