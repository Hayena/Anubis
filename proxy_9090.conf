listen {
  host = "127.0.0.1"
  port = 4001
}

api {
  host = "127.0.0.1"
  port = 9090
}

proxies = [
  {
    name = "office"
    type = "http"
    host = "proxy.company.com"
    port = 8080
    health {
      interval = 30
      timeout = 5
    }
  }
]

proxy_groups = [
  {
    name = "europe"
    strategy = "failover"
    members = ["office"]
  }
]

rules = [
  {
    domain = "*.company.com"
    route = "office"
  },
  {
    route = "direct"
  }
]
