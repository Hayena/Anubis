listen {
  host = "127.0.0.1"
  port = 4001
}

// REST API server configuration
api {
  host = "127.0.0.1"
  port = 8080
}

proxies = [
  {
    name = "office"
    type = "http"
    host = "proxy.company.com"
    port = 8080
    health {
      interval = 30
      timeout = 5
    }
  },
  {
    name = "vpn"
    type = "socks5"
    host = "vpn.example.com"
    port = 1080
    health {
      interval = 60
      timeout = 10
    }
  }
]

proxy_groups = [
  {
    name = "europe"
    strategy = "failover"
    members = ["office", "vpn"]
  },
  {
    name = "latency"
    strategy = "lowest_latency"
    members = ["office", "vpn"]
  }
]

rules = [
  {
    domain = "*.company.com"
    route = "office"
  },
  {
    domain = "*.streaming.com"
    route = "vpn"
  },
  {
    host = "github.com"
    route = "direct"
  },
  {
    cidr = "10.0.0.0/8"
    route = "direct"
  },
  {
    route = "direct"
  }
]

default = "direct"

api {
  host = "127.0.0.1"
  port = 9090
}
